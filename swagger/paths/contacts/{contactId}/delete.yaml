tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContactById
description: Remove a contact from the user's list
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: ID of the contact to delete
    schema:
      type: string
responses:
  '204':
    description: Contact deleted successfully. No content returned.
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              properties:
                message:
                  type: string
                  example: No token provided
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              properties:
                message:
                  type: string
                  example: Contact not found
