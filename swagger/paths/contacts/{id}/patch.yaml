tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContactById
description: Modify contact information
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/ContactInput.yaml
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ContactInput.yaml'
  '404':
    description: Contact not found
