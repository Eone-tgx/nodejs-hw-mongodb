  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Documentation of Contacts App
tags:
  - name: Contacts
    description: Operation about contacts.
servers:
  - url: http://localhost:3000
